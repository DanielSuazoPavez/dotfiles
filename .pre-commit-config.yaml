repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=100']
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Uses the system shellcheck rather than koalaman/shellcheck-precommit: that
  # repo ships only a docker_image hook, which cannot read the working tree
  # under rootless Docker.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        # -x follows sourced files. The suites source helpers.sh and links.sh
        # via runtime variables, which shellcheck cannot resolve without it.
        entry: shellcheck -x
        types: [shell]
        # Covers executable scripts and shell *config* alike. Config is sourced,
        # not run, so SC2148 "no shebang" and the SC1090/SC1091 source-following
        # notices are inherent to what those files are; they're suppressed by
        # `# shellcheck shell=bash` directives in the files themselves, the same
        # way links.sh and tests/helpers.sh handle being sourced.
        files: ^(install\.sh|uninstall\.sh|links\.sh|tests/.*\.sh|scripts/.*\.sh|\.bashrc|\.aliases)$
