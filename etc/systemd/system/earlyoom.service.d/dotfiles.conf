# earlyoom override — copied (not symlinked) to
# /etc/systemd/system/earlyoom.service.d/ by install.sh, since /etc is root-owned.
#
# Replaces ExecStart rather than setting EARLYOOM_ARGS: distros ship the args
# via an EnvironmentFile at different paths (/etc/default, /etc/sysconfig), and
# EnvironmentFile wins over Environment=, so only a full ExecStart is reliable.
#
#   -m 10 -s 25  act when available RAM <= 10% AND free swap <= 25%
#                (SIGKILL at half of each). Both must hold, so a large swap
#                delays the kill — keep swap modest (~8G) for earlyoom to bite.
#   -r 3600      memory report in the journal once an hour
#   --prefer     runaway Python scripts/kernels are the usual culprit
#   --avoid      killing the compositor or audio stack takes the session with it
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 10 -s 25 --prefer '^(python[0-9.]*|jupyter.*)$' --avoid '^(kwin_wayland|kwin_x11|plasmashell|Xwayland|Xorg|sddm|gnome-shell|pipewire.*|wireplumber)$'
