# Disable WirePlumber's libcamera monitor; the v4l2 monitor keeps the webcam.
#
# With both monitors on, a UVC webcam is exposed twice (once per backend) and
# the two contend for the same device. Symptom: a browser call (Teams in
# Firefox) comes up with no video and no audio after a previous call, until
# `systemctl --user restart wireplumber pipewire pipewire-pulse`.
#
# Do NOT apply on machines whose camera only works through libcamera (MIPI/IPU6
# sensors on some newer Intel laptops) — this would hide it entirely.
# Takes effect on: systemctl --user restart wireplumber
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
